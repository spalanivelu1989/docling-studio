# Neo4j for the knowledge graph -- query it with Cypher (docs/neo4j.md).
#
#   docker compose -f compose.neo4j.yml up -d      (or: podman compose ...)
#   .venv/bin/python kg_neo4j_load.py              load / reload the graph
#   open http://localhost:7474                      Neo4j Browser
#
# The password is NEO4J_PASSWORD from .env, which compose reads on its own.
# Ports are bound to 127.0.0.1: this is a local copy of the graph for
# querying, not a service for the network.
services:
  neo4j:
    image: docker.io/library/neo4j:5-community
    container_name: docling-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # Browser (HTTP)
      - "127.0.0.1:7687:7687"   # Bolt (drivers)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # APOC for apoc.meta.graph() and friends; downloaded on first start.
      NEO4J_PLUGINS: '["apoc"]'
      # Sized for a 2 GB container VM. The graph is ~11k nodes and ~21k
      # relationships -- a few MB on disk -- so this is ample.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # Every load deletes and rewrites the whole graph, so the default
      # transaction-log retention (2 days, up to 2 GB) keeps hundreds of MB of
      # history for a copy that is always rebuilt from knowledge_graph.json.
      # Keep only what recovery needs. Retention deletes whole rotated files,
      # so the file size has to come down too: at the default 256M one load's
      # worth of log never rotates and is never pruned.
      NEO4J_db_tx__log_rotation_retention__policy: 100M size
      NEO4J_db_tx__log_rotation_size: 32M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  neo4j-data:
